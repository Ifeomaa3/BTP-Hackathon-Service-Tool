<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Finder (Simple)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .service { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
    h2 { margin-top: 0; }
    ul { padding-left: 20px; }
    label { display: block; margin-top: 10px; }
    button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
    .note { font-size: 0.9em; color: #444; margin-top: 6px; }
    .clarify { border: 1px dashed #999; padding: 12px; border-radius: 6px; margin-top: 16px; }
    .sow { border-top: 1px dashed #aaa; margin-top: 10px; padding-top: 10px; font-size: 0.95em; color: #222; }
  </style>
</head>
<body>
  <h1>Matched Services</h1>

  <div>
    <label>
      Customer Needs:
      <input type="text" id="needs" placeholder="e.g. deployment, security, HR cloud" size="50"/>
    </label>
    <label>
      Budget Tier:
      <select id="budgetTier">
        <option value="Foundational">Foundational</option>
        <option value="Advanced">Advanced</option>
        <option value="Max">Max</option>
      </select>
    </label>
    <button onclick="loadServices()">Search</button>
  </div>

  <div id="clarify" class="clarify" style="display:none;"></div>
  <div id="results" style="margin-top:20px;">Enter needs and click search.</div>

  <script>
    async function loadServices() {
      const needs = document.getElementById("needs").value || "basic support";
      const budgetTier = document.getElementById("budgetTier").value;

      const clarifyBox = document.getElementById("clarify");
      clarifyBox.style.display = "none";
      clarifyBox.innerHTML = "";

      try {
        const response = await fetch("http://localhost:3001/match-services", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            companyName: "Demo Company",
            customerNeeds: needs,
            budgetTier: budgetTier
          })
        });

        if (!response.ok) {
          document.getElementById("results").textContent = "Error: " + response.status;
          return;
        }

        const data = await response.json();
        console.log("Response data:", data);

        if (data.status === "needs_clarification" && Array.isArray(data.clarifyingQuestions)) {
          renderClarifyingQuestions(data.clarifyingQuestions);
          document.getElementById("results").textContent = "Waiting for clarification…";
          return;
        }

        if (!data.recommendations || data.recommendations.length === 0) {
          document.getElementById("results").textContent = "No services found.";
          return;
        }

        let html = "";
        data.recommendations.forEach((service, idx) => {
          html += `
            <div class="service" id="service-${idx}">
              <h2>${service.serviceName}</h2>
              <p>${service.description}</p>
              <p><strong>Category:</strong> ${service.category}</p>
              <p><strong>Price:</strong> ${service.gRateOrPricingEstimate}</p>
              <p><strong>Effort:</strong> ${service.estimatedEffortPersonDays} person-days</p>
              <p><strong>ROM Estimate:</strong> ${service.romEstimate || "N/A"}</p>

              ${service.entitlements && service.entitlements.length > 0 ? `
                <strong>Included Entitlements:</strong>
                <ul>
                  ${service.entitlements.map(e => `<li>${e}</li>`).join("")}
                </ul>
              ` : ""}

              ${service.rationale ? `
                <div class="note"><em>Why recommended?</em> ${service.rationale}</div>
              ` : ""}

              <button onclick="showSOW(${idx})">Show SOW</button>
              <div id="sow-${idx}" class="sow" style="display:none;"></div>
            </div>
          `;
        });

        document.getElementById("results").innerHTML = html;

      } catch (err) {
        console.error("Error loading services:", err);
        document.getElementById("results").textContent = "Error loading data.";
      }
    }

    function renderClarifyingQuestions(questions) {
      const clarifyBox = document.getElementById("clarify");
      const needsInput = document.getElementById("needs");

      let qHtml = `<strong>We need a bit more detail:</strong><br/><br/>`;
      qHtml += `<form id="clarifyForm">`;
      questions.forEach((q, i) => {
        qHtml += `
          <label><input type="checkbox" name="q${i}" value="${q.text.replace(/"/g, '&quot;')}">
            ${q.text}
          </label>`;
      });
      qHtml += `<button type="submit">Apply Answers</button>`;
      qHtml += `</form>`;

      clarifyBox.innerHTML = qHtml;
      clarifyBox.style.display = "block";

      document.getElementById("clarifyForm").onsubmit = (e) => {
        e.preventDefault();
        const form = e.target;
        const chosen = [];
        [...form.elements].forEach(el => {
          if (el.type === 'checkbox' && el.checked) chosen.push(el.value);
        });
        if (chosen.length) {
          needsInput.value = `${needsInput.value} ${chosen.join(' ')}`;
        }
        loadServices();
      };
    }

    function showSOW(idx) {
      const sowDiv = document.getElementById(`sow-${idx}`);
      const serviceDiv = document.getElementById(`service-${idx}`);
      if (sowDiv.style.display === "none") {
        const name = serviceDiv.querySelector("h2").textContent;
        const category = serviceDiv.querySelector("p strong").nextSibling.textContent;
        const price = serviceDiv.querySelector("p:nth-of-type(2)").textContent;
        const effort = serviceDiv.querySelector("p:nth-of-type(3)").textContent;
        const rom = serviceDiv.querySelector("p:nth-of-type(4)").textContent;
        sowDiv.innerHTML = `
          <strong>SOW Summary:</strong><br/>
          Service: ${name}<br/>
          ${category}<br/>
          ${price}<br/>
          ${effort}<br/>
          ${rom}
        `;
        sowDiv.style.display = "block";
      } else {
        sowDiv.style.display = "none";
      }
    }
  </script>
</body>
</html>
